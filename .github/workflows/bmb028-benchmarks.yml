name: BMB-028 measured benchmarks
on:
  push:
    paths:
      - "evaluation/**"
      - "agentguide/**"
      - "agent/**"
      - "agentctx/**"
      - "bomc/**"
      - "core/**"
      - "schemas/benchmark-result-v1.schema.json"
      - "examples/bmb025-prompts.json"
      - "examples/module-ir-two-rooms.json"
      - "tests/test_bmb028_benchmarks.py"
      - "tests/interop/**"
      - "docs/BMB-028-BENCHMARKS.md"
      - ".github/workflows/bmb028-benchmarks.yml"
  pull_request:
    paths:
      - "evaluation/**"
      - "agentguide/**"
      - "agent/**"
      - "agentctx/**"
      - "bomc/**"
      - "core/**"
      - "schemas/benchmark-result-v1.schema.json"
      - "examples/bmb025-prompts.json"
      - "examples/module-ir-two-rooms.json"
      - "tests/test_bmb028_benchmarks.py"
      - "tests/interop/**"
      - "docs/BMB-028-BENCHMARKS.md"
      - ".github/workflows/bmb028-benchmarks.yml"
  workflow_dispatch:
    inputs:
      trials:
        description: "Cold trials (1-20, default 3)"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TRIALS: ${{ github.event.inputs.trials || '3' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert the checked-out commit is the one under test
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "checked out ${actual}; expected ${EXPECTED_SHA}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Harness tests
        run: python -m unittest discover -s tests -p test_bmb028_benchmarks.py -v
      - name: Predecessor regressions the workflow depends on
        shell: bash
        run: |
          for t in test_bmb023_mcp test_bmb024_context test_bmb025_agent test_bmb020_compiler test_bmb021_interop; do
            python -m unittest discover -s tests -p "${t}.py"
          done
      - name: Measured cold trials
        shell: bash
        run: |
          python -m evaluation.run --trials "${TRIALS}" --out benchmark-result.json > benchmark-summary.json
          python -c "import json; s=json.load(open('benchmark-summary.json')); assert s['trialsCompleted']==int('${TRIALS}') and s['deterministic']['identical'], s['deterministic']"
      - name: Record the evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### BMB-028 measured benchmark (${{ matrix.os }})"
            echo "- commit: \`${EXPECTED_SHA}\`, run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- scripted controller, no model: tokens are estimator values; timing and memory are descriptive, not a performance claim"
            echo "- NOT_RUN: BMB-004 four-room baseline, Editor and Model-Eval import, live LLM tokens, security gates"
            if [ -f benchmark-summary.json ]; then echo '```json'; cat benchmark-summary.json; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the full result (all trials and summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmb028-benchmark-${{ matrix.os }}
          path: |
            benchmark-result.json
            benchmark-summary.json
          if-no-files-found: warn
          retention-days: 14
