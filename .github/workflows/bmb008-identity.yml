name: BMB-008 identity and revisions
on:
  push:
    paths:
      - "core/**"
      - "tests/test_bmb008_identity.py"
      - ".github/workflows/bmb008-identity.yml"
  pull_request:
    paths:
      - "core/**"
      - "tests/test_bmb008_identity.py"
      - ".github/workflows/bmb008-identity.yml"
  workflow_dispatch:

jobs:
  identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identity, revision and idempotency tests
        run: python -m unittest discover -s tests -p test_bmb008_identity.py -v
