name: BMB-018 solid semantic face IR
on:
  pull_request:
    paths:
      - 'core/geometry/**'
      - 'schemas/module-ir-v1.schema.json'
      - 'examples/module-ir-semantic-faces.json'
      - 'tests/test_bmb018_semantics.py'
      - 'docs/BMB-018-SEMANTIC-FACES.md'
      - '.github/workflows/bmb018-semantics.yml'
  push:
    branches: [main]
    paths:
      - 'core/geometry/**'
      - 'schemas/module-ir-v1.schema.json'
      - 'examples/module-ir-semantic-faces.json'
      - 'tests/test_bmb018_semantics.py'
      - '.github/workflows/bmb018-semantics.yml'
permissions:
  contents: read
jobs:
  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema==4.23.0'
      - run: python -m unittest discover -s tests -p 'test_bmb018_semantics.py' -v
      - run: python -m unittest discover -s tests -p 'test_module_ir_schema.py' -v
