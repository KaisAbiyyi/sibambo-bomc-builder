name: BMB-030 adversarial QA
on:
  push:
    paths:
      - "agent/**"
      - "agentctx/**"
      - "bomc/**"
      - "cli/**"
      - "core/**"
      - "tools/**"
      - "tests/interop/**"
      - "tests/qa/**"
      - "tests/test_bmb030_adversarial.py"
      - ".github/workflows/bmb030-adversarial.yml"
  pull_request:
    paths:
      - "agent/**"
      - "agentctx/**"
      - "bomc/**"
      - "cli/**"
      - "core/**"
      - "tools/**"
      - "tests/interop/**"
      - "tests/qa/**"
      - "tests/test_bmb030_adversarial.py"
      - ".github/workflows/bmb030-adversarial.yml"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Fuzz iterations per target (default 400)"
        required: false
        default: "400"

permissions:
  contents: read

jobs:
  adversarial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BMB_FUZZ_ITERS: ${{ github.event.inputs.iterations || '400' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert the checked-out commit is the one under test
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "checked out ${actual}; expected ${EXPECTED_SHA}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Adversarial suite (seeded fuzzing, bounded resources)
        run: python -m unittest discover -s tests -p test_bmb030_adversarial.py -v
      - name: Regressions for the code that was hardened
        shell: bash
        run: |
          for t in test_bmb009_graph test_bmb010_journal test_bmb011_assembly test_bmb012_validator test_bmb014_wall \
                   test_bmb015_openings test_bmb018_semantics test_bmb020_compiler test_bmb021_interop \
                   test_bmb022_cli test_bmb023_mcp test_bmb024_context; do
            python -m unittest discover -s tests -p "${t}.py"
          done
      - name: Record the evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### BMB-030 adversarial QA (${{ matrix.os }})"
            echo "- commit: \`${EXPECTED_SHA}\`, run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- fuzz iterations per target: ${BMB_FUZZ_ITERS}; python \`$(python --version)\`"
            echo "- NOT_RUN: native Windows ACL/Job Object, hostile co-tenant and symlink/junction races, power loss, external MCP hosts"
          } >> "$GITHUB_STEP_SUMMARY"
