name: BMB-015 topology cutout acceptance

on:
  pull_request:
    paths:
      - 'core/geometry/openings.py'
      - 'core/geometry/wall.py'
      - 'tests/test_bmb015_openings.py'
      - 'docs/BMB-015-OPENINGS.md'
      - 'examples/module-ir-two-rooms.json'
      - '.github/workflows/bmb015-openings.yml'
  push:
    branches: [main]
    paths:
      - 'core/geometry/openings.py'
      - 'tests/test_bmb015_openings.py'
      - '.github/workflows/bmb015-openings.yml'

permissions:
  contents: read

jobs:
  opening-topology:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deterministic schema test dependency
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Focused real-cutout topology acceptance
        run: python -m unittest discover -s tests -p 'test_bmb015_openings.py' -v
      - name: Full existing regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
