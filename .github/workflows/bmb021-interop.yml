name: BMB-021 Builder-side interop certification
on:
  push:
    paths:
      - "core/**"
      - "bomc/**"
      - "examples/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/**"
      - "compatibility/**"
      - "tests/interop/**"
      - "tests/test_bmb021_interop.py"
      - "tests/test_bmb019_writer.py"
      - "tests/test_bmb020_compiler.py"
      - "tests/test_bmb020_semantic.py"
      - "tests/test_bmb009_graph.py"
      - "tests/test_bmb011_assembly.py"
      - "tests/test_compatibility_matrix.py"
      - "tests/test_fixture_harness.py"
      - ".github/workflows/bmb021-interop.yml"
  pull_request:
    paths:
      - "core/**"
      - "bomc/**"
      - "examples/**"
      - "schemas/**"
      - "fixtures/**"
      - "tools/**"
      - "compatibility/**"
      - "tests/interop/**"
      - "tests/test_bmb021_interop.py"
      - "tests/test_bmb019_writer.py"
      - "tests/test_bmb020_compiler.py"
      - "tests/test_bmb020_semantic.py"
      - "tests/test_bmb009_graph.py"
      - "tests/test_bmb011_assembly.py"
      - "tests/test_compatibility_matrix.py"
      - "tests/test_fixture_harness.py"
      - ".github/workflows/bmb021-interop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert the checked-out commit is the one under test
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "checked out ${actual}; expected ${EXPECTED_SHA}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Committed goldens equal a fresh compile
        run: python -m tests.interop.goldens --check tests/interop/goldens
      - name: BMB-021 goldens, strict reader and corruption matrix
        run: python -m unittest discover -s tests -p test_bmb021_interop.py -v
      - name: Compiler, writer, graph, assembly, fixture and matrix regressions
        shell: bash
        run: |
          for t in test_bmb019_writer test_bmb020_compiler test_bmb020_semantic test_bmb009_graph \
                   test_bmb011_assembly test_fixture_harness test_compatibility_matrix; do
            python -m unittest discover -s tests -p "${t}.py" -v
          done
      - name: Record the evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### BMB-021 Builder-side certification"
            echo "- commit: \`${EXPECTED_SHA}\`"
            echo "- runner: \`${{ matrix.os }}\`, python \`$(python --version)\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- gates: goldens --check, test_bmb021_interop, test_bmb019_writer, test_bmb020_compiler, test_bmb020_semantic, test_bmb009_graph, test_bmb011_assembly, test_fixture_harness, test_compatibility_matrix"
            echo "- original Editor E4 / Model-Eval / Ruby pairings and section 241 at those consumers: NOT_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
