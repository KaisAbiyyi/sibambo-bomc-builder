name: BMB-023 stdio MCP acceptance
on:
  push:
    paths:
      - "agent/**"
      - "cli/**"
      - "core/identity/**"
      - "core/storage/**"
      - "core/assembly/**"
      - "tests/test_bmb023_mcp*.py"
      - "tests/fixtures/mcp-2026-07-28-schema.json"
      - "docs/BMB-023-STDIO-MCP.md"
      - ".github/workflows/bmb023-mcp.yml"
  pull_request:
    paths:
      - "agent/**"
      - "cli/**"
      - "core/identity/**"
      - "core/storage/**"
      - "core/assembly/**"
      - "tests/test_bmb023_mcp*.py"
      - "tests/fixtures/mcp-2026-07-28-schema.json"
      - "docs/BMB-023-STDIO-MCP.md"
      - ".github/workflows/bmb023-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdio:
    name: stdio and shared-core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source HEAD / provenance
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected PR/push HEAD: $EXPECTED_HEAD"
          echo "Actual checkout HEAD: $actual"
          echo "GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$actual" = "$EXPECTED_HEAD"
          echo "Exact HEAD: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Record platform and test validator version
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0 mcp==2.3.0
          python -c 'import platform, importlib.metadata as m; print("OS:", platform.platform()); print("Python:", platform.python_version()); print("jsonschema:", m.version("jsonschema")); print("mcp:", m.version("mcp"))'
          echo "OS: $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          python -c 'import platform; print("Python:", platform.python_version())'
      - name: MCP adversarial stdio integration
        run: python -m unittest discover -s tests -p test_bmb023_mcp.py -v
      - name: Published MCP 2026-07-28 schema validation (pinned)
        run: python -m unittest discover -s tests -p test_bmb023_mcp_schema.py -v
      - name: Real MCP Python SDK v2.3.0 stdio interoperability
        run: python -m unittest discover -s tests -p test_bmb023_mcp_sdk.py -v
      - name: CLI subprocess regression
        run: python -m unittest discover -s tests -p test_bmb022_cli.py -v
      - name: Journal regression
        run: python -m unittest discover -s tests -p test_bmb010_journal.py -v
      - name: Identity regression
        run: python -m unittest discover -s tests -p test_bmb008_identity.py -v
      - name: Assembly regression
        run: python -m unittest discover -s tests -p test_bmb011_assembly.py -v
