name: BMB-022 headless CLI
on:
  push:
    paths:
      - "cli/**"
      - "core/identity/**"
      - "core/storage/**"
      - "core/assembly/**"
      - "tests/test_bmb022_cli.py"
      - ".github/workflows/bmb022-cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - "core/identity/**"
      - "core/storage/**"
      - "core/assembly/**"
      - "tests/test_bmb022_cli.py"
      - ".github/workflows/bmb022-cli.yml"
  workflow_dispatch:

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CLI subprocess acceptance
        run: python -m unittest discover -s tests -p test_bmb022_cli.py -v
      - name: Journal regression
        run: python -m unittest discover -s tests -p test_bmb010_journal.py -v
      - name: Identity regression
        run: python -m unittest discover -s tests -p test_bmb008_identity.py -v
      - name: Assembly regression
        run: python -m unittest discover -s tests -p test_bmb011_assembly.py -v
