name: BMB-009 definition-instance graph
on:
  push:
    paths:
      - "core/**"
      - "tests/test_bmb009_graph.py"
      - ".github/workflows/bmb009-graph.yml"
  pull_request:
    paths:
      - "core/**"
      - "tests/test_bmb009_graph.py"
      - ".github/workflows/bmb009-graph.yml"
  workflow_dispatch:

jobs:
  graph:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Graph, transform and cycle tests
        run: python -m unittest discover -s tests -p test_bmb009_graph.py -v
