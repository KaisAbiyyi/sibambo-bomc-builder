name: SE-03 authenticated remote Streamable HTTP MCP adapter
on:
  push:
    paths:
      - 'service/**'
      - 'core/**'
      - 'bomc/**'
      - 'schemas/draft-*.json'
      - 'tests/test_remote_mcp*.py'
      - 'tests/remote_support.py'
      - 'examples/se03_evidence.py'
      - 'scripts/check_hash_lock.py'
      - 'docs/stable/**'
      - 'docs/two-phase/ERROR-CATALOG.md'
      - 'scripts/owner_acceptance/se03.ps1'
      - '.github/workflows/se03-remote-mcp.yml'
  pull_request:
    paths:
      - 'service/**'
      - 'core/**'
      - 'bomc/**'
      - 'schemas/draft-*.json'
      - 'tests/test_remote_mcp*.py'
      - 'tests/remote_support.py'
      - 'examples/se03_evidence.py'
      - 'scripts/check_hash_lock.py'
      - 'docs/stable/**'
      - 'docs/two-phase/ERROR-CATALOG.md'
      - 'scripts/owner_acceptance/se03.ps1'
      - '.github/workflows/se03-remote-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  se03:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested candidate SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Exact HEAD: $EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: S11 lock file is fully hashed, and an unhashed lock FAILS
        shell: bash
        run: |
          python scripts/check_hash_lock.py service/requirements.lock
          printf 'mcp==2.3.0\n' > unhashed.lock
          if python scripts/check_hash_lock.py unhashed.lock; then echo "unhashed lock was accepted"; exit 1; fi
          if python -m pip install --require-hashes --dry-run -r unhashed.lock; then echo "pip accepted an unhashed lock"; exit 1; fi
          rm unhashed.lock
      - name: Install ONLY the hash-locked service dependencies
        run: python -m pip install --require-hashes -r service/requirements.lock
      - name: SE-03 remote MCP integration (real SDK client over TLS), negative, conformance, bridge and catalogue tests
        run: python -m unittest discover -s tests -p "test_remote_mcp*.py" -v
      - name: SE-01 / SE-02 regressions (typed operations, actor) are unchanged
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_draft_operations.py
          python -m unittest discover -s tests -p test_project_actor.py
      - name: Predecessor regressions (compiler bytes, interop, four-room, geometry)
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_bmb01*.py'
          python -m unittest discover -s tests -p 'test_bmb020_*.py'
          python -m unittest discover -s tests -p test_bmb021_interop.py
          python -m unittest discover -s tests -p test_bmb026_house.py
          python -m unittest discover -s tests -p 'test_bmb03*.py'
      - name: Existing stdio MCP tests are unchanged
        run: python -m unittest discover -s tests -p "test_bmb023_mcp*.py"
      - name: Owner PowerShell helper end-to-end on a clean checkout (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/owner_acceptance/se03.ps1 -SelfTest
          ./scripts/owner_acceptance/se03.ps1 -TestedSha $env:EXPECTED_SHA -EvidenceDir "$env:RUNNER_TEMP\se03-owner"
          Get-Content "$env:RUNNER_TEMP\se03-owner\se03-result.txt"
      - name: Show owner-helper logs on failure (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\se03-owner" -Filter "log-*.txt" -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.Name) ==="; Get-Content $_.FullName -Tail 60 }
      - name: Owner evidence generator with pinned expected hashes
        shell: bash
        run: |
          python -m examples.se03_evidence --out-dir se03-evidence --check docs/stable/owner-handoff/se03-expected.json | tee se03-stdout.txt
          grep -q "SE03_RESULT=PASS" se03-stdout.txt
          {
            echo "### SE-03 cloud evidence (${{ matrix.os }})"
            echo "Exact source SHA: $EXPECTED_SHA"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Cloud/Builder-only. Real Claude Code/Codex OAuth, managed IdP tenant, tunnel, Editor, WebSocket: NOT_RUN."
            echo '~~~json'
            cat se03-evidence/receipt.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: se03-evidence-${{ matrix.os }}
          path: se03-evidence/*
          if-no-files-found: error
          retention-days: 14
