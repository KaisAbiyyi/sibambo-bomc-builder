name: BMB-024 scoped context and sessions
on:
  push:
    paths:
      - "agentctx/**"
      - "core/**"
      - "tests/test_bmb024_context.py"
      - ".github/workflows/bmb024-context.yml"
  pull_request:
    paths:
      - "agentctx/**"
      - "core/**"
      - "tests/test_bmb024_context.py"
      - ".github/workflows/bmb024-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert the checked-out commit is the one under test
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "checked out ${actual}; expected ${EXPECTED_SHA}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Context, budget, checkpoint, resume and replay tests
        run: python -m unittest discover -s tests -p test_bmb024_context.py -v
      - name: Identity, journal and assembly regressions
        shell: bash
        run: |
          for t in test_bmb008_identity test_bmb010_journal test_bmb011_assembly test_bmb012_validator; do
            python -m unittest discover -s tests -p "${t}.py"
          done
      - name: Token-cost evidence (estimator based)
        shell: bash
        run: |
          python -m agentctx.evidence | tee evidence.json
          {
            echo "### BMB-024 token-cost evidence (${{ matrix.os }})"
            echo "- commit: \`${EXPECTED_SHA}\`, run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo '- estimator: ceil(canonical-json-utf8 bytes / 4); provider-native token counts: not measured'
            echo '```json'
            cat evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
