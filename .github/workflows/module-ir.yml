name: BMB-006 module IR schema
on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/module-ir-*.json'
      - 'tests/test_module_ir_schema.py'
      - '.github/workflows/module-ir.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'examples/module-ir-*.json'
      - 'tests/test_module_ir_schema.py'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema==4.23.0'
      - run: python -m unittest discover -s tests -p 'test_module_ir_schema.py' -v
