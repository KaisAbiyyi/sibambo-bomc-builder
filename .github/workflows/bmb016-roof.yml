name: BMB-016 roof ceiling and stairs
on:
  pull_request:
    paths:
      - 'core/geometry/roof.py'
      - 'core/geometry/__init__.py'
      - 'tests/test_bmb016_roof.py'
      - 'docs/BMB-016-ROOF-STAIRS.md'
      - '.github/workflows/bmb016-roof.yml'
  push:
    branches: [main]
    paths:
      - 'core/geometry/roof.py'
      - 'core/geometry/__init__.py'
      - 'tests/test_bmb016_roof.py'
      - '.github/workflows/bmb016-roof.yml'
permissions:
  contents: read
jobs:
  roof-ceiling-stairs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema test dependency
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Focused roof/ceiling/stair acceptance
        run: python -m unittest discover -s tests -p 'test_bmb016_roof.py' -v
      - name: Full builder Python regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
