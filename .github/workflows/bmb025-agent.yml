name: BMB-025 scripted agent guide
on:
  push:
    paths:
      - 'agentguide/**'
      - 'agent/**'
      - 'agentctx/**'
      - 'cli/**'
      - 'core/**'
      - 'tests/test_bmb025_agent.py'
      - 'examples/bmb025-prompts.json'
      - 'examples/module-ir-two-rooms.json'
      - 'docs/AGENT-CONSTRUCTION-GUIDE.md'
      - '.github/workflows/bmb025-agent.yml'
  pull_request:
    paths:
      - 'agentguide/**'
      - 'agent/**'
      - 'agentctx/**'
      - 'cli/**'
      - 'core/**'
      - 'tests/test_bmb025_agent.py'
      - 'examples/bmb025-prompts.json'
      - 'examples/module-ir-two-rooms.json'
      - 'docs/AGENT-CONSTRUCTION-GUIDE.md'
      - '.github/workflows/bmb025-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripted-controller:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Exact HEAD: $EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Scripted controller negative and happy-path tests
        run: python -m unittest discover -s tests -p test_bmb025_agent.py -v
      - name: Predecessor MCP/context regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_bmb023_mcp.py
          python -m unittest discover -s tests -p test_bmb024_context.py
      - name: Emit synthetic evidence with NOT_RUN gates
        shell: bash
        run: |
          python -m agentguide.controller --pretty > evidence.json
          python -c "import json; d=json.load(open('evidence.json')); assert d['bmb025TargetVerdict']=='PASS'; assert d['fullProductE2E']=='INCOMPLETE'; assert d['gates']['typed_geometry_or_bomc_compile']=='NOT_RUN'"
          {
            echo "### BMB-025 cloud scripted controller (${{ matrix.os }})"
            echo "Exact SHA: $EXPECTED_SHA"
            echo "CI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo 'Evidence is a deterministic scripted controller, not a real LLM or BOMC binary build.'
            echo '```json'
            cat evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
