name: BMB-032 generator handoff
on:
  push:
    paths:
      - "integration/**"
      - "agentguide/**"
      - "agent/**"
      - "agentctx/**"
      - "core/**"
      - "bomc/**"
      - "schemas/generator-handoff-v1.schema.json"
      - "examples/generator/**"
      - "tests/test_bmb032_generator.py"
      - "tests/qa/**"
      - "docs/BMB-032-GENERATOR-HANDOFF.md"
      - ".github/workflows/bmb032-generator.yml"
  pull_request:
    paths:
      - "integration/**"
      - "agentguide/**"
      - "agent/**"
      - "agentctx/**"
      - "core/**"
      - "bomc/**"
      - "schemas/generator-handoff-v1.schema.json"
      - "examples/generator/**"
      - "tests/test_bmb032_generator.py"
      - "tests/qa/**"
      - "docs/BMB-032-GENERATOR-HANDOFF.md"
      - ".github/workflows/bmb032-generator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-handoff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert the checked-out commit is the one under test
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "checked out ${actual}; expected ${EXPECTED_SHA}"
          test "${actual}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the pinned schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Generator handoff tests (no LLM, no network)
        run: python -m unittest discover -s tests -p test_bmb032_generator.py -v
      - name: Regressions for the API the handoff reuses
        shell: bash
        run: |
          for t in test_bmb022_cli test_bmb023_mcp test_bmb024_context test_bmb025_agent; do
            python -m unittest discover -s tests -p "${t}.py"
          done
      - name: Lower and submit the bundled examples
        shell: bash
        run: |
          for kind in room-brief-three-room survey-two-bedroom form-three-room; do
            python -m integration.generator lower --input "examples/generator/${kind}.json" > "lowered-${kind}.json"
          done
          python -m integration.generator submit --input examples/generator/room-brief-three-room.json \
            --root "${RUNNER_TEMP}/bmb032-project" > evidence.json
          python -c "import json; d=json.load(open('evidence.json')); assert d['assemblyModules']==3 and d['llmRequired'] is False and d['networkRequired'] is False"
      - name: Record the evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### BMB-032 generator handoff (${{ matrix.os }})"
            echo "- commit: \`${EXPECTED_SHA}\`, run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- scripted, deterministic, no model and no network; Editor import, a real silabs-generator and a live agent are NOT_RUN"
            if [ -f evidence.json ]; then echo '```json'; cat evidence.json; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
