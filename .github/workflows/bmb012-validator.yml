name: BMB-012 typed assembly validator
on:
  push:
    paths:
      - "core/validator/**"
      - "tests/test_bmb012_validator.py"
      - ".github/workflows/bmb012-validator.yml"
  pull_request:
    paths:
      - "core/validator/**"
      - "tests/test_bmb012_validator.py"
      - ".github/workflows/bmb012-validator.yml"
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator for full regression
        run: python -m pip install 'jsonschema>=4.22,<5' 'mcp==2.3.0'
      - name: Focused BMB-012 tests
        run: python -m unittest discover -s tests -p test_bmb012_validator.py -v
      - name: Full Python regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
